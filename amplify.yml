version: 1
backend:
  phases:
    build:
      commands:
        - nvm use 22 || true
        - npm ci --cache .npm --prefer-offline --no-audit --no-fund
        - |
          if git diff --quiet HEAD^ HEAD -- amplify/; then
            echo "No Amplify backend changes detected; skipping backend deployment."
          else
            echo "Amplify backend changes detected; deploying backend."
            npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
          fi
frontend:
  phases:
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
      - node_modules/**/*
