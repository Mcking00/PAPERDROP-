version: 1
backend:
  phases:
    build:
      commands:
        - nvm use 22 || true
        - npm install --cache .npm --prefer-offline --no-audit --no-fund || echo "PAPERDROPL npm install failed; continuing diagnostics"
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID || echo "PAPERDROPL backend deployment failed; continuing diagnostics"
        - npx ampx generate outputs --branch $AWS_BRANCH --app-id $AWS_APP_ID || echo "PAPERDROPL output generation failed; continuing diagnostics"
        - node scripts/paperdropl-diagnostics.mjs || echo "PAPERDROPL diagnostics completed with errors"
frontend:
  phases:
    build:
      commands:
        - test -f diagnostic-logs/latest-summary.log || exit 1
        - cat diagnostic-logs/latest-summary.log
        - node scripts/paperdropl-final-check.mjs
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
      - node_modules/**/*
      - diagnostic-logs/**/*
