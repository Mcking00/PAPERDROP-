version: 1
backend:
  phases:
    build:
      commands:
        - nvm use 22
        - npm install --package-lock-only --ignore-scripts --no-audit --no-fund
        - npm ci --cache .npm --prefer-offline --no-audit --no-fund
        - npx ampx pipeline-deploy --branch "$AWS_BRANCH" --app-id "$AWS_APP_ID"
        - npx ampx generate outputs --branch "$AWS_BRANCH" --app-id "$AWS_APP_ID"
        - node scripts/paperdropl-diagnostics.mjs
frontend:
  phases:
    build:
      commands:
        - test -f diagnostic-logs/latest-summary.log
        - cat diagnostic-logs/latest-summary.log
        - node scripts/paperdropl-final-check.mjs
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
      - node_modules/**/*
      - diagnostic-logs/**/*
