version: 1
backend:
  phases:
    build:
      commands:
        - nvm use 22 || echo "PAPERDROPL could not switch Node versions; continuing with the current Node runtime"
        - node scripts/paperdropl-amplify-build.mjs
frontend:
  phases:
    build:
      commands:
        - test -f diagnostic-logs/latest-summary.log
        - cat diagnostic-logs/latest-summary.log
        - node scripts/paperdropl-final-check.mjs
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
      - node_modules/**/*
      - diagnostic-logs/**/*
